<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Joël Koïkoï Koïvogui · Présentation</title>
<style>
  @font-face { font-family: 'Cormorant'; font-style: italic; src: url('../../fonts/cormorant-italique-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant'; font-style: italic; src: url('../../fonts/cormorant-italique-latin-ext.woff2') format('woff2'); unicode-range: U+0100-024F; }
  html, body { margin: 0; background: #05070f; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script src="commun.js"></script>
<script>
'use strict';
// Présentation longue (8 min 53). Chaque animation est calée sur la voix
// off : timeline.js (produit par voix.py) donne le début et la fin de chaque
// phrase.

// =====================================================================
// SCÈNES
// =====================================================================

// ---------- 1. introduction ----------
function scIntro(t) {
  const a = scene(t, 'intro', .01);
  if (!a) return;
  g.save(); g.globalAlpha = a;
  const cx = W / 2;

  // point de lumière d'ouverture
  const p0 = prog(t, 0, 1.6);
  lueur(cx, 420, 320 * sortie3(p0) + 20, COUL.or, .45 * (1 - prog(t, 3, 6)) + .1);
  for (let i = 0; i < 3; i++) {
    const p = prog(t, .3 + i * .4, 3 + i * .4);
    if (p > 0 && p < 1) { g.save(); g.globalAlpha *= (1 - p) * .5; anneau(cx, 420, 30 + sortie3(p) * 700, COUL.or, 2); g.restore(); }
  }

  // « Bonjour à toutes et à tous ! »
  const ab = fenetre(t, D('bonjour') - .3, D('nom') + .2, .4, .5);
  if (ab) {
    g.save(); g.globalAlpha *= ab;
    texteMots('Bonjour à toutes et à tous !', cx, 470, prog(t, D('bonjour') - .2, F('bonjour')), { taille: 110, graisse: 500, famille: SERIF, italique: true });
    g.restore();
  }

  // le nom, puis il remonte quand la suite arrive
  const an = fenetre(t, D('nom'), D('conakry') + .1, .2, .5);
  if (an) {
    g.save(); g.globalAlpha *= an;
    texteLettres('JOËL KOÏKOÏ KOÏVOGUI', cx, 470, prog(t, D('nom'), F('nom') + .3), { taille: 112, graisse: 800, espace: 6, montee: 50 });
    const pl = entreeSortie(prog(t, D('nom') + .4, F('nom') + .6));
    g.fillStyle = COUL.or; g.fillRect(cx - 480 * pl, 515, 960 * pl, 3);
    // les rôles, au rythme de la phrase
    const roles = [['Développeur web & mobile', COUL.cyan, 0], ['Entrepreneur technologique', COUL.or, .2], ['Autodidacte', COUL.corail, .4]];
    let tot = 0; police(30, 600);
    const ws = roles.map(([r]) => g.measureText(r).width + 48);
    tot = ws.reduce((x, y) => x + y, 0) + 20 * (roles.length - 1);
    let x = cx - tot / 2;
    roles.forEach(([r, k, f], i) => { pastille(r, x, 600, prog(t, frac('roles', f), frac('roles', f) + .5), { couleur: k, taille: 30 }); x += ws[i] + 20; });
    const passions = [['Innovation', .55], ['Intelligence artificielle', .7], ['Robotique', .88]];
    police(26, 600);
    const wp = passions.map(([r]) => g.measureText(r).width + 42);
    const totp = wp.reduce((x, y) => x + y, 0) + 16 * (passions.length - 1);
    x = cx - totp / 2;
    passions.forEach(([r, f], i) => { pastille(r, x, 680, prog(t, frac('roles', f), frac('roles', f) + .5), { couleur: COUL.violet, taille: 26 }); x += wp[i] + 16; });
    g.restore();
  }

  // Conakry, Guinée
  const ag = fenetre(t, D('conakry') - .2, D('ambition') + .3, .5, .6);
  if (ag) {
    g.save(); g.globalAlpha *= ag;
    const G = carteAfrique(t, D('conakry'), 1450, 560, 7.2);
    const pe = sortie3(prog(t, D('conakry') + .6, D('conakry') + 1.4));
    g.save(); g.globalAlpha *= pe;
    g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(G[0] - 10, G[1]); g.lineTo(G[0] - 160, G[1]); g.stroke();
    police(54, 800); g.textAlign = 'right'; g.fillStyle = COUL.encre;
    g.fillText('Conakry', G[0] - 180, G[1] + 4);
    police(30, 500); g.fillStyle = COUL.doux; g.textAlign = 'right';
    g.fillText('Guinée', G[0] - 180, G[1] + 52);
    drapeau(G[0] - 180 - g.measureText('Guinée').width - 56, G[1] + 28, 28);
    g.restore();
    texteMots('Construire mon parcours', 200, 520, prog(t, frac('conakry', .5), frac('conakry', .8)), { taille: 46, graisse: 700, align: 'left' });
    texteMots('dans le numérique.', 200, 580, prog(t, frac('conakry', .6), frac('conakry', .9)), { taille: 46, graisse: 700, align: 'left', couleur: COUL.or });
    g.restore();
  }

  // l'ambition : trois cartes
  const aa = fenetre(t, D('ambition') - .2, D('premiers') + .2, .5, .6);
  if (aa) {
    g.save(); g.globalAlpha *= aa;
    texteMots('Mon ambition est claire.', cx, 300, prog(t, D('ambition'), frac('ambition', .2)), { taille: 64, graisse: 800 });
    const items = [['Développer', 'mes compétences', COUL.cyan, .25], ['Concrétiser', 'mes idées', COUL.violet, .45], ['Concevoir', 'des solutions utiles', COUL.or, .65]];
    items.forEach(([v, s, k, f], i) => {
      const p = sortie5(prog(t, frac('ambition', f), frac('ambition', f) + .7));
      if (p <= 0) return;
      const x = cx - 780 + i * 540, y = 400;
      g.save(); g.globalAlpha *= p; g.translate(0, (1 - p) * 50);
      carte(x, y, 480, 260);
      g.fillStyle = k; g.fillRect(x + 40, y, 90, 4);
      police(22, 700); g.fillStyle = k; g.textAlign = 'left'; g.fillText('0' + (i + 1), x + 40, y + 70);
      police(50, 800); g.fillStyle = COUL.encre; g.fillText(v, x + 40, y + 150);
      police(30, 400); g.fillStyle = COUL.doux; g.fillText(s, x + 40, y + 200);
      g.restore();
    });
    texteMots('…capables de répondre à des problèmes réels.', cx, 760, prog(t, frac('ambition', .8), F('ambition') + .4), { taille: 40, graisse: 500, famille: SERIF, italique: true, accents: { réels: COUL.or } });
    g.restore();
  }

  // « bien plus qu'un domaine d'étude » : quatre verbes
  const av = fenetre(t, D('premiers') - .2, Infinity, .5);
  if (av) {
    g.save(); g.globalAlpha *= av;
    const p1 = prog(t, D('premiers'), frac('premiers', .6));
    texteMots('La technologie, bien plus', cx, 300, p1, { taille: 70, graisse: 800 });
    texteMots("qu'un domaine d'étude.", cx, 385, prog(t, frac('premiers', .3), F('premiers')), { taille: 70, graisse: 800, couleur: COUL.doux });
    const verbes = [['Créer', COUL.cyan, .2], ['Innover', COUL.violet, .32], ['Entreprendre', COUL.or, .46], ['Contribuer', COUL.vert, .66]];
    verbes.forEach(([v, k, f], i) => {
      const d = frac('moyen', f);
      const p = rebond(prog(t, d, d + .6));
      if (p <= 0) return;
      const x = cx - 645 + i * 430, y = 580;
      g.save(); g.globalAlpha *= borne(p * 2);
      g.translate(x, y); g.scale(p, p);
      lueur(0, 0, 160, k, .25);
      anneau(0, 0, 110, k, 3, borne(p));
      police(40, 800); g.fillStyle = COUL.encre; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(v, 0, 0);
      g.restore();
    });
    g.restore();
  }
  g.restore();
}

// ---------- 2. parcours ----------
function scParcours(t) {
  const a = scene(t, 'parcours');
  if (!a) return;
  g.save(); g.globalAlpha = a;
  chapitre(t, 'parcours', '01', 'Parcours', COUL.cyan);

  g.save(); g.globalAlpha *= 1 - prog(t, D('unc') - .3, D('unc') + .2);
  motCle(t, D('vision') + .2, 'AUTODIDACTE', W / 2, 330, COUL.corail, { taille: 150 });
  texteMots('Apprendre le développement web et mobile', W / 2, 410, prog(t, frac('vision', .4), F('vision') + .3), { taille: 40, graisse: 500, couleur: COUL.doux });

  // frise 2022 → aujourd'hui
  const y = 620, x0 = 260, x1 = W - 260;
  const pf = entreeSortie(prog(t, D('2022'), F('2022')));
  g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
  const gr = g.createLinearGradient(x0, 0, x1, 0); gr.addColorStop(0, COUL.cyan); gr.addColorStop(1, COUL.or);
  g.strokeStyle = gr; g.lineWidth = 4;
  g.beginPath(); g.moveTo(x0, y); g.lineTo(lin(x0, x1, pf), y); g.stroke();
  if (pf > 0 && pf < 1) lueur(lin(x0, x1, pf), y, 50, COUL.or, .9);
  const etapes = [['2022', 'Premières lignes de code', 0], ['Pratiquer', '', .3], ['Expérimenter', '', .55], ['Multiplier les projets', '', .8], ['Aujourd’hui', 'Progresser encore', 1]];
  etapes.forEach(([titre, sous, f]) => {
    const x = lin(x0, x1, f);
    const p = rebond(prog(t, lin(D('2022'), F('2022'), f), lin(D('2022'), F('2022'), f) + .5));
    if (p <= 0) return;
    cercle(x, y, 14 * p, COUL.sombre);
    anneau(x, y, 14 * p, f === 1 ? COUL.or : COUL.cyan, 3);
    cercle(x, y, 5 * p, f === 1 ? COUL.or : COUL.cyan);
    g.save(); g.globalAlpha *= borne(p);
    police(f === 0 ? 44 : 30, 800); g.fillStyle = f === 0 ? COUL.cyan : COUL.encre; g.textAlign = 'center';
    g.fillText(titre, x, y - 40);
    if (sous) { police(24, 400); g.fillStyle = COUL.doux; g.fillText(sous, x, y + 55); }
    g.restore();
  });

  g.restore();

  // UNC : études + pratique, avec deux photos
  const au = fenetre(t, D('unc') - .2, Infinity, .5);
  if (au) {
    g.save(); g.globalAlpha *= au;
    const p1 = sortie5(prog(t, D('unc') - .1, D('unc') + .9));
    const p2 = sortie5(prog(t, frac('unc', .45), frac('unc', .45) + 1));
    g.save(); g.globalAlpha *= p1; g.translate(0, (1 - p1) * 60);
    cadrePhoto('ev-cloud-unc', 140, 170, 440, 640, { foyer: [.5, .42], zoom: 1 + (t - D('unc')) * .01, legende: 'Journée du Cloud 2024 · UNC', bord: 'rgba(139,123,255,0.6)' });
    g.restore();
    g.save(); g.globalAlpha *= p2; g.translate(0, (1 - p2) * 60);
    cadrePhoto('ev-odc', 620, 250, 420, 560, { foyer: [.5, .45], zoom: 1 + (t - D('unc')) * .01, legende: 'Orange Digital Center', bord: 'rgba(58,214,230,0.6)' });
    g.restore();
    texteMots('Études à l’UNC', 1120, 400, prog(t, D('unc'), frac('unc', .4)), { taille: 64, graisse: 800, align: 'left', couleur: COUL.violet });
    texteMots('Université Nongo Conakry', 1120, 460, prog(t, frac('unc', .15), frac('unc', .5)), { taille: 32, graisse: 500, align: 'left', couleur: COUL.doux });
    police(64, 800); g.fillStyle = COUL.or; g.textAlign = 'left'; g.globalAlpha *= p2; g.fillText('+', 1120, 570);
    texteMots('Apprentissage', 1120, 650, prog(t, frac('unc', .5), frac('unc', .8)), { taille: 64, graisse: 800, align: 'left', couleur: COUL.cyan });
    texteMots('par la pratique', 1120, 725, prog(t, frac('unc', .6), F('unc')), { taille: 64, graisse: 800, align: 'left' });
    g.restore();
  }
  g.restore();
}

// ---------- 3. la stack ----------
function scStack(t) {
  const a = scene(t, 'stack');
  if (!a) return;
  g.save(); g.globalAlpha = a;
  chapitre(t, 'stack', '02', 'Compétences', COUL.cyan);

  // phase 1 : le web
  const a1 = fenetre(t, D('web') - .3, D('mobile') - .1, .4, .5);
  if (a1) {
    g.save(); g.globalAlpha *= a1;
    texteMots('Web & plateformes', W / 2, 230, prog(t, D('web'), D('web') + .8), { taille: 60, graisse: 800 });
    TECHS.web.forEach((tc, i) => {
      const f = .25 + i * .12;
      tuile(t, tc, W / 2 - 625 + i * 250, 450, prog(t, frac('web', f) - .3, frac('web', f) + .3));
    });
    const sorties = [['Applications web', .1], ['Plateformes numériques', .35], ['Solutions sur mesure', .65]];
    let x = W / 2 - 560;
    sorties.forEach(([s, f]) => { x += pastille(s, x, 700, prog(t, frac('web2', f), frac('web2', f) + .5), { couleur: COUL.or, taille: 30 }) + 30; });
    g.restore();
  }
  // phase 2 : mobile, bureau, électronique
  const a2 = fenetre(t, D('mobile') - .1, Infinity, .5);
  if (a2) {
    g.save(); g.globalAlpha *= a2;
    texteMots('Mobile', 480, 260, prog(t, D('mobile'), D('mobile') + .6), { taille: 46, graisse: 800 });
    TECHS.mobile.forEach((tc, i) => tuile(t, tc, 360 + i * 240, 450, prog(t, frac('mobile', .4 + i * .25) - .3, frac('mobile', .4 + i * .25) + .3)));
    texteMots('Bureau · Python · Électronique & IoT', 1300, 260, prog(t, D('autres'), D('autres') + 1), { taille: 46, graisse: 800 });
    const fs = [.05, .4, .55, .66];
    TECHS.autres.forEach((tc, i) => tuile(t, tc, 940 + i * 240, 450, prog(t, frac('autres', fs[i]) - .2, frac('autres', fs[i]) + .4)));
    // petit circuit animé sous l'électronique
    const pc = prog(t, frac('autres', .7), F('autres'));
    if (pc > 0) {
      g.save(); g.globalAlpha *= pc;
      g.strokeStyle = 'rgba(231,53,44,0.5)'; g.lineWidth = 2;
      const xs = [1180, 1420];
      g.beginPath(); g.moveTo(xs[0], 560); g.lineTo(xs[0], 640); g.lineTo(xs[1], 640); g.lineTo(xs[1], 560); g.stroke();
      const q = (t * .5) % 1;
      const px = q < .25 ? xs[0] : q < .75 ? lin(xs[0], xs[1], (q - .25) * 2) : xs[1];
      const py = q < .25 ? lin(560, 640, q * 4) : q < .75 ? 640 : lin(640, 560, (q - .75) * 4);
      lueur(px, py, 24, COUL.corail, .9); cercle(px, py, 3, '#fff');
      police(26, 600); g.fillStyle = COUL.doux; g.textAlign = 'center'; g.fillText('Internet des objets', 1300, 700);
      g.restore();
    }
    g.restore();
  }
  g.restore();
}

// ---------- 4. de l'idée au produit, et l'IA ----------
function scIdee(t) {
  const a = scene(t, 'idee');
  if (!a) return;
  g.save(); g.globalAlpha = a;
  chapitre(t, 'idee', '03', 'De l’idée au produit', COUL.violet);

  const a1 = fenetre(t, D('passion') - .3, D('ia-dev') - .2, .4, .6);
  if (a1) {
    g.save(); g.globalAlpha *= a1;
    const y = 470;
    // idée
    const p1 = prog(t, D('passion'), frac('passion', .9));
    ampoule(430, y, 90, sortie3(p1) * (.8 + .2 * Math.sin(t * 4)));
    texteMots('Une simple idée', 430, y + 170, p1, { taille: 34, graisse: 700 });
    // réflexion
    const p2 = prog(t, D('passion2'), frac('passion2', .5));
    if (p2 > 0) {
      g.save(); g.globalAlpha *= sortie3(p2);
      engrenage(930, y - 30, 70, t * .8, COUL.violet);
      engrenage(1020, y + 50, 48, -t * 1.15 + .3, COUL.cyan);
      g.restore();
      texteMots('Réfléchir, concrétiser', 960, y + 170, p2, { taille: 34, graisse: 700 });
    }
    // produit
    const p3 = sortie5(prog(t, frac('passion2', .55), F('passion2')));
    if (p3 > 0) {
      g.save(); g.globalAlpha *= p3; g.translate(0, (1 - p3) * 60);
      telephone(1400, y - 260, 200, 380, (x, yy, w, h) => {
        g.fillStyle = COUL.or; g.fillRect(x, yy, w, 60);
        police(18, 800); g.fillStyle = COUL.fond; g.textAlign = 'left'; g.fillText('Mon produit', x + 14, yy + 38);
        for (let i = 0; i < 4; i++) {
          rr(x + 12, yy + 80 + i * 66, w - 24, 52, 10); g.fillStyle = 'rgba(255,255,255,0.08)'; g.fill();
          cercle(x + 38, yy + 106 + i * 66, 12, [COUL.cyan, COUL.violet, COUL.vert, COUL.corail][i]);
          g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x + 62, yy + 98 + i * 66, (w - 100) * (.5 + .4 * alea(i)), 8);
        }
      });
      g.restore();
      texteMots('Un produit fonctionnel', 1500, y + 170, p3, { taille: 34, graisse: 700, couleur: COUL.or });
    }
    // flèches
    [[540, 820, prog(t, frac('passion', .9), D('passion2'))], [1100, 1370, prog(t, frac('passion2', .45), frac('passion2', .6))]].forEach(([xa, xb, p]) => {
      if (p <= 0) return;
      g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 3; g.setLineDash([10, 10]); g.lineDashOffset = -t * 30;
      g.beginPath(); g.moveTo(xa, y); g.lineTo(lin(xa, xb, sortie3(p)), y); g.stroke(); g.setLineDash([]);
    });
    // explorer, résoudre, découvrir
    const verbes = [['Explorer', 'de nouvelles approches', .05], ['Résoudre', 'des problèmes', .35], ['Découvrir', 'des outils efficaces', .62]];
    verbes.forEach(([v, s, f], i) => {
      const p = sortie3(prog(t, frac('explorer', f), frac('explorer', f) + .6));
      if (p <= 0) return;
      g.save(); g.globalAlpha *= p;
      police(30, 800); g.fillStyle = [COUL.cyan, COUL.violet, COUL.or][i]; g.textAlign = 'center';
      g.fillText(v, 560 + i * 400, 780 - (1 - p) * 20);
      police(24, 400); g.fillStyle = COUL.doux; g.fillText(s, 560 + i * 400, 815 - (1 - p) * 20);
      g.restore();
    });
    g.restore();
  }

  // développement assisté par l'IA
  const a2 = fenetre(t, D('ia-dev') - .2, Infinity, .5);
  if (a2) {
    g.save(); g.globalAlpha *= a2;
    texteMots('Développement assisté', 120, 260, prog(t, D('ia-dev'), frac('ia-dev', .5)), { taille: 62, graisse: 800, align: 'left' });
    texteMots('par l’intelligence artificielle', 120, 335, prog(t, frac('ia-dev', .3), F('ia-dev')), { taille: 62, graisse: 800, align: 'left', couleur: COUL.violet });
    const gains = [['Création accélérée', '⚡', .05], ['Productivité', '↗', .35], ['Nouvelle façon de concevoir', '✦', .65]];
    gains.forEach(([gtxt, ic, f], i) => {
      const p = sortie5(prog(t, frac('ia-dev2', f), frac('ia-dev2', f) + .6));
      if (p <= 0) return;
      g.save(); g.globalAlpha *= p; g.translate((1 - p) * -40, 0);
      cercle(150, 455 + i * 95, 30, 'rgba(139,123,255,0.18)');
      police(28, 800); g.fillStyle = COUL.violet; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ic, 150, 457 + i * 95);
      police(34, 600); g.fillStyle = COUL.encre; g.textAlign = 'left'; g.fillText(gtxt, 200, 457 + i * 95);
      g.textBaseline = 'alphabetic';
      g.restore();
    });
    // éditeur avec suggestion de l'IA
    const pe = sortie5(prog(t, D('ia-dev'), D('ia-dev') + 1));
    const ex = 1000, ey = 220, ew = 800, eh = 560;
    g.save(); g.globalAlpha *= pe; g.translate(0, (1 - pe) * 60);
    carte(ex, ey, ew, eh, { r: 18, fond: '#0c1222', ombre: 'rgba(139,123,255,0.3)' });
    [COUL.corail, COUL.or, COUL.vert].forEach((k, i) => cercle(ex + 30 + i * 24, ey + 30, 7, k));
    police(18, 500); g.fillStyle = COUL.doux; g.textAlign = 'center'; g.fillText('app.tsx', ex + ew / 2, ey + 36);
    const code = [
      [COUL.violet, '// Afficher les ventes du jour par boutique'],
      [COUL.cyan, 'export async function ventesDuJour(boutiqueId) {'],
    ];
    const suggestion = [
      '  const debut = new Date().setHours(0, 0, 0, 0);',
      '  const ventes = await Vente.find({ boutiqueId,',
      '    date: { $gte: debut } });',
      '  return ventes.reduce((s, v) => s + v.montant, 0);',
      '}',
    ];
    police(21, 500, MONO); g.textAlign = 'left';
    code.forEach(([k, l], i) => { g.fillStyle = k; g.fillText(l.slice(0, Math.floor(l.length * prog(t, D('ia-dev') + .5 + i * .8, D('ia-dev') + 1.3 + i * .8))), ex + 40, ey + 110 + i * 38); });
    const ps = prog(t, frac('ia-dev', .85), frac('ia-dev', .85) + 1.4);
    const valide = t > frac('ia-dev2', .3);
    suggestion.forEach((l, i) => {
      const n = Math.floor(l.length * borne(ps * suggestion.length - i));
      g.fillStyle = valide ? '#c9cfdc' : 'rgba(201,207,220,0.35)';
      g.fillText(l.slice(0, n), ex + 40, ey + 186 + i * 38);
    });
    if (ps > 0 && !valide) {
      pastille('✦ Suggestion de l’IA · Tab pour accepter', ex + 40, ey + eh - 60, prog(t, frac('ia-dev', .85), frac('ia-dev', .85) + .4), { couleur: COUL.violet, taille: 20 });

    texteMots('Ne pas seulement suivre l’évolution de la technologie…', W / 2, 640, prog(t, D('ambition2'), F('ambition2')), { taille: 40, graisse: 500, couleur: COUL.doux });
    texteMots('…participer activement à sa construction.', W / 2, 720, prog(t, D('ambition3'), frac('ambition3', .6)), { taille: 52, graisse: 800, accents: { construction: COUL.or } });
    g.restore();
  }

  // la conviction et les transformations
  const a3 = fenetre(t, D('convaincu') - .1, D('merci') - .3, .4, .5);
  if (a3) {
    g.save(); g.globalAlpha *= a3;
    const ph = 1 - entreeSortie(prog(t, D('transformer') - .3, D('transformer') + .3));
    g.save(); g.globalAlpha *= ph;
    texteMots('Les idées prennent de la valeur', W / 2, 420, prog(t, frac('convaincu', .35), frac('convaincu', .7)), { taille: 80, graisse: 800 });
    texteMots('lorsqu’on décide de les concrétiser.', W / 2, 520, prog(t, frac('convaincu', .6), F('convaincu') + .3), { taille: 80, graisse: 800, couleur: COUL.or });
    g.restore();
    const tr = [['Idées', 'Solutions', .15], ['Connaissances', 'Compétences', .45], ['Ambitions', 'Réalisations concrètes', .7]];
    tr.forEach(([de, vers, f], i) => {
      const p = sortie5(prog(t, frac('transformer', f), frac('transformer', f) + .6));
      if (p <= 0) return;
      const y = 340 + i * 150;
      g.save(); g.globalAlpha *= p;
      police(54, 700); g.fillStyle = COUL.doux; g.textAlign = 'right'; g.fillText(de, W / 2 - 110, y);
      g.strokeStyle = COUL.or; g.lineWidth = 4; g.beginPath(); g.moveTo(W / 2 - 70, y - 18); g.lineTo(W / 2 - 70 + 140 * p, y - 18); g.stroke();
      g.beginPath(); g.moveTo(W / 2 + 70 * p + 0, y - 32); g.lineTo(W / 2 + 70 * p + 14, y - 18); g.lineTo(W / 2 + 70 * p, y - 4); g.stroke();
      police(54, 900); g.fillStyle = COUL.encre; g.textAlign = 'left'; g.fillText(vers, W / 2 + 110, y);
      g.restore();
    });
    g.restore();
  }

  // carte de fin : photo, nom, titre, merci
  const a4 = fenetre(t, D('merci') - .3, Infinity, .8);
  if (a4) {
    g.save(); g.globalAlpha *= a4;
    portrait(t, W / 2, 330, 175, sortie5(prog(t, D('merci') - .3, D('merci') + .9)));
    texteLettres('JOËL KOÏKOÏ KOÏVOGUI', W / 2, 640, prog(t, D('merci') + .3, D('merci') + 1.8), { taille: 84, graisse: 900, espace: 4 });
    texteMots('Développeur web et mobile · Entrepreneur technologique', W / 2, 710, prog(t, D('merci') + 1.2, D('merci') + 2.4), { taille: 34, graisse: 500, couleur: COUL.doux });
    const pl = entreeSortie(prog(t, D('merci') + 1.8, D('merci') + 2.8));
    g.fillStyle = COUL.or; g.fillRect(W / 2 - 220 * pl, 750, 440 * pl, 2);
    texteMots('Merci.', W / 2, 860, prog(t, D('merci') - .1, D('merci') + .6), { taille: 96, graisse: 500, famille: SERIF, italique: true, couleur: COUL.or });
    texteMots('Conakry · Guinée', W / 2, 930, prog(t, D('merci') + 2.4, D('merci') + 3.4), { taille: 26, graisse: 600, couleur: COUL.doux });
    g.restore();
  }
  g.restore();
}

demarrer([scIntro, scParcours, scStack, scIdee, scRealisations, scIA, scEntreprise, scFata, scJeunes, scYen, scVision, scAfrique, scConclusion], 'sortie/voix.wav');
